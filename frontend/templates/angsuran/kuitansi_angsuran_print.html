{% load kkpris_tags %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kuitansi Pembayaran Angsuran {{ pembayaran.no_kuitansi }} — SI-KKPRIS</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
            padding: 32px;
        }
        .receipt-box {
            max-width: 720px;
            margin: 0 auto;
            background: #ffffff;
            border: 2px solid #0f766e;
            padding: 28px 32px;
        }
        .header-table {
            width: 100%;
            border-bottom: 2px solid #0f766e;
            padding-bottom: 14px;
            margin-bottom: 20px;
        }
        .receipt-title {
            font-size: 18px;
            font-weight: 700;
            color: #0f766e;
        }
        .receipt-sub {
            font-size: 12px;
            color: #475569;
        }
        .doc-number {
            font-weight: 700;
            font-size: 14px;
        }
        .kv-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        .kv-table td {
            padding: 8px 6px;
            border-bottom: 1px dashed #cbd5e1;
            font-size: 13.5px;
        }
        .kv-label {
            width: 38%;
            color: #475569;
        }
        .amount-banner-table {
            width: 100%;
            background: #f0fdfa;
            border: 1.5px solid #0f766e;
            margin-bottom: 24px;
        }
        .amount-banner-table td {
            padding: 14px 18px;
            font-size: 16px;
            font-weight: 700;
            color: #115e59;
        }
        .amount-value {
            text-align: right;
        }
        .sign-table {
            width: 100%;
            margin-top: 28px;
            font-size: 13px;
        }
        .sign-space {
            height: 56px;
        }
        .sign-space-sm {
            height: 42px;
        }
        @media print {
            body { background: #ffffff; padding: 0; }
            .no-print { display: none; }
        }
    </style>
</head>
<body>
<div class="receipt-box">
    {% include "angsuran/_kuitansi_isi.html" %}

    <div class="no-print" style="margin-top: 24px; text-align: right; display: flex; justify-content: flex-end; gap: 10px;">
        <a href="{% url 'unduh_kuitansi_pdf' pembayaran.no_kuitansi %}" style="padding: 8px 18px; background: #ffffff; color: #111827; border: 1.5px solid #cbd5e1; text-decoration: none; font-weight: 600;">
            Unduh PDF
        </a>
        <button onclick="window.print()" style="padding: 8px 18px; background: #111827; color: #fff; border: none; cursor: pointer; font-weight: 600;">
            Cetak Sekarang
        </button>
    </div>
</div>
</body>
</html>
