{% load kkpris_tags %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kuitansi Simpanan {{ mutasi.no_kuitansi }} — SI-KKPRIS</title>
    <style>
        body {
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
            padding: 32px 16px;
        }
        .receipt-card {
            max-width: 720px;
            margin: 0 auto;
            background: #ffffff;
            border: 2px solid #0f766e;
            padding: 32px;
        }
        .header-table {
            width: 100%;
            border-bottom: 2px solid #0f766e;
            padding-bottom: 16px;
            margin-bottom: 20px;
        }
        .receipt-title {
            font-size: 16px;
            font-weight: 700;
        }
        .receipt-sub {
            font-size: 12.5px;
            color: #475569;
        }
        .doc-label {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .doc-number {
            font-size: 12.5px;
            color: #115e59;
            font-weight: 600;
        }
        .kv-table {
            width: 100%;
            margin-bottom: 20px;
        }
        .kv-table td {
            padding: 8px 6px;
            border-bottom: 1px dashed #cbd5e1;
            font-size: 13.5px;
        }
        .kv-label {
            width: 38%;
            color: #475569;
        }
        .amount-banner {
            background: #f0fdfa;
            border: 1.5px solid #0f766e;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 700;
            color: #115e59;
            margin-bottom: 20px;
        }
        .sign-table {
            width: 100%;
            margin-top: 28px;
            font-size: 13px;
        }
        .sign-space {
            height: 52px;
        }
        .sign-space-sm {
            height: 38px;
        }
        .sign-name {
            font-weight: 700;
            text-decoration: underline;
        }
        .sign-role {
            font-size: 11.5px;
            color: #64748b;
        }
        .btn {
            display: inline-block;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }
        .btn-outline {
            background: #ffffff;
            color: #0f172a;
            border: 1.5px solid #cbd5e1;
        }
        .btn-primary-dark {
            background: #111827;
            color: #ffffff;
            border: 1.5px solid #111827;
        }
        @media print {
            body {
                background: #ffffff;
                padding: 0;
            }
            .no-print {
                display: none !important;
            }
            .receipt-card {
                border: 1.5px solid #000000;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="receipt-card">
        {% include "simpanan/_kuitansi_isi.html" %}

        <div class="no-print" style="margin-top: 28px; padding-top: 16px; border-top: 1px dashed #cbd5e1; display: flex; justify-content: flex-end; gap: 10px;">
            <a href="{% url 'kelola_simpanan' %}" class="btn btn-outline">Kembali ke Simpanan</a>
            <a href="{% url 'unduh_kuitansi_pdf' mutasi.no_kuitansi %}" class="btn btn-outline">Unduh PDF</a>
            <button type="button" class="btn btn-primary-dark" onclick="window.print()">Cetak Kuitansi</button>
        </div>
    </div>
</body>
</html>
